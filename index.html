<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fafaf8">
  <meta name="description" content="Queos Labs. Automating research.">
  <meta property="og:title" content="Queos Labs">
  <meta property="og:description" content="Automating research.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://queoslabs.github.io/">
  <link rel="canonical" href="https://queoslabs.github.io/">
  <title>Queos Labs</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23fafaf8'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-family='Arial,sans-serif' font-size='50' font-weight='900' fill='%231e3af5'%3EQ%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme:light; --blue:#1e3af5; --paper:#fafaf8; --ink:#171717; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { margin:0; min-height:100vh; min-height:100svh; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:100%; min-height:100vh; min-height:100svh; display:flex; flex-direction:column; justify-content:space-between; padding:clamp(32px,6vw,96px); gap:56px; }
    .intro { margin-top:clamp(34px,7vh,96px); }
    h1 { margin:0; font-family:Arial,Helvetica,sans-serif; font-size:clamp(5rem,18.7vw,18.5rem); font-weight:900; letter-spacing:-.092em; line-height:.82; color:var(--blue); }
    h1 span { display:block; }
    p { margin:clamp(33px,5vw,70px) 0 0; font-size:clamp(1.35rem,2.7vw,2.6rem); font-weight:500; letter-spacing:-.045em; line-height:1.2; }
    .rule { width:100%; height:2px; background:var(--blue); flex-shrink:0; }
    @media(max-width:600px) {
      main { padding:24px; gap:40px; }
      .intro { margin-top:12vh; }
      h1 { font-size:19.5vw; line-height:.85; letter-spacing:-.09em; }
      p { margin-top:28px; font-size:clamp(1.25rem,5.5vw,1.6rem); }
    }
  </style>
</head>
<body>
  <main>
    <div class="intro">
      <h1><span>QUEOS</span><span>LABS.</span></h1>
      <p>Automating research.</p>
    </div>
    <div class="rule" aria-hidden="true"></div>
  </main>
</body>
</html>
